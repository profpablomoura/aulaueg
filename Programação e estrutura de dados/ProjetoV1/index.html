<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO CONJUNTO</title>
</head>

<body>

    <h1>PROGRAMA DO PROJETO CONJUNTO</h1>
    <label for="inTamanhoConjunto">DIGITE O TAMANHO DO CONJUNTO</label>
    <input type="number" id="inTamanhoConjunto" placeholder="Tamanho do conjunto">
    <button type="button" id="btnCriarConjunto" onclick="eventoCriarConjunto()">
        Criar Conjunto
    </button>
    <h3>Apresentação do Conjunto Criado Aleatoriamente</h3>
    <p id="onSaidaConjunto"></p>


    <h3>VALOR A SER ENCONTRADO</h3>
    <label for="inNumeroConjunto">Valor a ser buscado no conjunto:</label>
    <input type="number" id="inNumeroConjunto" placeholder="Qual número">
    <button type="button" id="btnBuscarNumero" onclick="eventoBuscar()">
        Buscar
    </button>
    <h3>Resultado</h3>
    <p id="onSaidaNumero"></p>

    <button type="button" id="btnMaiorMenor" onclick="eventoMaiorMenor()">
        Encontrar Maior e Menor
    </button>

    <script src="js/ConjuntoAleatorio.js"></script>


</body>
</html>
