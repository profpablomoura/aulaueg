<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJETO CONJUNTO</title>

    <!-- Pico CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
</head>

<body>

    <main class="container">

        <h1>PROGRAMA DO PROJETO CONJUNTO</h1>

        <label for="inTamanhoConjunto">
            Digite o tamanho do conjunto
        </label>

        <input
            type="number"
            id="inTamanhoConjunto"
            placeholder="Tamanho do conjunto"
        >

        <button
            type="button"
            id="btnCriarConjunto"
            onclick="funcao()">
            Criar Conjunto
        </button>

        <h3>
            Apresentação do Conjunto Criado Aleatoriamente
        </h3>

        <p id="onSaidaConjunto"></p>

    </main>

    <script src="ConjuntoAleatorio.js"></script>

</body>
</html>
