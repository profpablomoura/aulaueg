<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular IMC</title>
</head>
<body>
    <H1>CALCULAR IMC DO PACIENTE</H1><hr> <!-- <hr> traça uma linha após o titulo-->
    <label for="idNomeCompleto">Nome Completo:</label>
    <input type="text" id="idInNomeCompleto" name="nomeCompleto" placeholder="Digite seu nome"><br><br>

    <label for="idPeso">Peso (kg):</label>
    <input type="number" id="idInPeso" name="peso" placeholder="Digite seu peso" step="0.01"><br><br>

    <label for="idAltura">Altura (m):</label>
    <input type="number" id="idInAltura" name="altura" placeholder="Digite sua altura" step="0.01"><br><br>

    <button type="button" id="idBtnCalcular" onclick="calcularIMC()">CALCULAR IMC</button><hr> 

    <H3>RESULTADO DO CALCULO DO IMC</H3>
    <p id="idOutResultado"></p>
    <script src="JS/calcularIMC.js"></script>
    
</body>
</html>
