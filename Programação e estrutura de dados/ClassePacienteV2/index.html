<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clínica GYN</title>
</head>

<body>

    <h1>CLÍNICA GYN</h1>

    <h2>Cadastro do Paciente</h2>

    <label>Nome Completo:</label>
    <input type="text" id="nomeCompleto">
    <br><br>

    <label>Peso (kg):</label>
    <input type="number" id="peso">
    <br><br>

    <label>Altura (m):</label>
    <input type="number" id="altura">
    <br><br>

    <label>Sexo:</label>
    <select id="sexo">
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
    </select>

    <br><br>

    <button id="btnCadastrar">Cadastrar Paciente</button>

    <h2>Dados do Paciente</h2>

    <div id="dadosPaciente"></div>

    <script type="module" src="./app.js"></script>

</body>

</html>
