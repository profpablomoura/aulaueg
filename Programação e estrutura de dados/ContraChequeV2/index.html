<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>GYNAlimentos - Contracheque</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>GYNALIMENTOS</h1>
        <p>Sistema de Cálculo de Contracheque</p>
    </header>

    <main>

        <form>

            <fieldset>
                <legend>Cadastro do Funcionário</legend>

                <p>
                    <label for="matricula">Matrícula:</label><br>
                    <input type="text" id="matricula" class="campo" required>
                </p>

                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" class="campo" required>
                </p>

                <p>
                    <label for="numeroDependentes">
                        Número de dependentes:
                    </label><br>

                    <input
                        type="number"
                        id="numeroDependentes"
                        class="campo"
                        min="0"
                        required>
                </p>

                <p>
                    <label for="salarioBase">Salário base:</label><br>

                    <input
                        type="number"
                        id="salarioBase"
                        class="campo"
                        step="0.01"
                        min="0"
                        required>
                </p>

                <p>
                    <label for="producao">Produção:</label><br>

                    <input
                        type="number"
                        id="producao"
                        class="campo"
                        min="0"
                        required>
                </p>

                <p>
                    <button type="button" id="btnCadastrar">
                        Gerar Contracheque
                    </button>
                </p>

            </fieldset>

        </form>


        <fieldset>
            <legend>Contracheque</legend>

            <section id="dadosFuncionario"></section>

        </fieldset>

    </main>


    <script type="module" src="./js/app.js"></script>

</body>

</html>
