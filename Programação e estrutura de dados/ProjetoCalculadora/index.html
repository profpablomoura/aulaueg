<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>

    <H1>Calculadora</H1><hr> <!-- <hr> traça uma linha após o titulo-->
    <label for="idInNum1">Número 1:</label>
    <input type="number" id="idInNum1" name="num1" placeholder="Digite o primeiro número"><br><br>

    <label for="idInNum2">Número 2:</label>
    <input type="number" id="idInNum2" name="num2"  placeholder="Digite o segundo número"><br><br>

    <button type="button" id="idBtnSomar" onclick="calcularSoma()">SOMAR</button>
    <button type="button" id="idBtnSubtrair" onclick="calcularSubtracao()">SUBTRAIR</button>
    <button type="button" id="idBtnMultiplicar" onclick="calcularMultiplicacao()">MULTIPLICAR</button>
    <button type="button" id="idBtnDividir" onclick="calcularDivisao()">DIVIDIR</button>
    <button type="button" id="idBtnPotencia" onclick="calcularPotencia()">POTÊNCIA</button>
    <button type="button" id="idBtnRaiz" onclick="calcularRaiz()">RAIZ</button><hr>
    
    <H3>RESULTADO DO CÁLCULO</H3>
    <p id="idOutResultado"></p>
    <script src="JS/calcular.js"></script>

</body>
</html>
