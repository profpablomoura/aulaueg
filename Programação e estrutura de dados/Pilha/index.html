
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromos</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="container">
        <h1>Verificador de Palíndromos</h1>

        <p>
            Digite uma palavra, frase ou número
            para verificar se é um palíndromo.
        </p>

        <input
            type="text"
            id="entrada"
            placeholder="Ex.: Arara, 12421..."
        >

        <button id="botaoVerificar">
            Verificar
        </button>

        <p id="resultado"></p>
    </div>

</body>
</html>
