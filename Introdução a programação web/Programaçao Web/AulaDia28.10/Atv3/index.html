<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cálculo do Cone</h1>

    <div class="caixa">
        <label for="raio">Raio:</label>
        <input type="number" id="raio" name="raio"> <br>
        <label for="altura">Altura:</label>
        <input type="number" id="altura" name="altura">
        <button type="button" onclick="calcularCone()">Calcular</button>
    </div>

    <div class="caixa">
        <p> Figura: <span id="figura"></span> </p>
        <p> Geratriz: <span id="geratrizResultado"></span> </p>
        <p> Área Lateral: <span id="areaLateralResultado"></span> </p>
        <p> Área Total: <span id="area"></span> </p>
        <p> Volume: <span id="volume"></span> </p>
    </div>

    <script src="script.js"></script> 
    
</body>
</html>
