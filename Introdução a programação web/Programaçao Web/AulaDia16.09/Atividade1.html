<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>
<h1> Cadastro de Usuário </h1>

<form action ="Atividade1.html" method="post">
    
    <fieldset>
        <legend> <b> Dados Pessoais </b></legend>

        <label for="nome"><b>Nome Completo:</b></label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required> <br> <br>

        <label for="cpf"><b>CPF:</b></label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required > <br> <br>

        <label for="dataNascimento"><b>Data de Nascimento:</b></label>
        <input type="date" id="dataNascimento" name="dataNascimento" required> <br> <br>

        <label for = "sexo"><b>Sexo:</b></label>
        <input type="radio" id="masculino" name="sexo" value="masculino" required> 
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="sexo" value="feminino" required> 
        <label for="feminino">Feminino</label> <br> <br>

        <label for = "estadoCivil"><b>Estado Civil</b></label>
        <select name="estadoCivil" id="estadoCivil" required>
            <option value="solteiro">Solteiro(a)</option>
            <option value="casado">Casado(a)</option>
            <option value="divorciado">Divorciado(a)</option>
            <option value="viuvo">Viúvo(a)</option>
        </select> <br><br>

    </fieldset>

    <fieldset>
    <legend><b>Dados de Contato</b></legend>
    
        <label for = "email"><b>Email:</b></label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required> <br><br>
        
        <label for="url"><b>WebSite</b></label>
        <input type="url" id="url" name="url" placeholder="Digite uma URL" required> <br><br>

        <label for ="endereco"><b>Endereço:</b></label>
        <input type="text" id="endereço" name="endereço" placeholder="Digite seu endereço" minlength="10" maxlength="100" required> <br><br>
        
        


    </fieldset>
</body>
</html>
