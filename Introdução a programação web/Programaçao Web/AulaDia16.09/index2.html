<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>

    <form action="codigo.js" method="post">

        <fieldset>
            <legend><b>Formulário de Cadastro</b></legend>
            <br>

            <fieldset>
                <legend><b>Dados I</b></legend>
                <br>

                <label for="nome"><b>Nome Completo</b></label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" minlength="4"
                    maxlength="30" required>
                <br><br>

                <label for="endereço"><b>Endereço</b></label>
                <input type="text" id="endereço" name="endereço" placeholder="Digite seu endereço" minlength="10"
                    maxlength="100" required>
                <br><br>

                <label for="cidade"><b>Cidade</b></label>
                <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" minlength="3"
                    maxlength="50" required>
                <br><br>

                <label for="cep"><b>CEP</b></label>
                <input type="text" id="cep" name="cep" placeholder="Digite seu CEP" pattern="[0-9]{5}-[0-9]{3}"
                    maxlength="8" required>
                <br><br>
            </fieldset>

            <fieldset>
                <legend><b>Dados II</b></legend>
                <br>
                <label for="email"><b>Email</b></label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                <br><br>

                <label for="senha"><b>Senha</b></label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6"
                    maxlength="20" required>
                <br><br>

                <label for="telefone"><b>Telefone</b></label>
                <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                <br><br>

            </fieldset>

            <fieldset>
                <legend><b>Dados III</b></legend>
                <br>
                <label for="dataNascimento"><b>Data de Nascimento</b></label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
                <br><br>

                <label for="url"><b>URL</b></label>
                <input type="url" id="url" name="url" placeholder="Digite uma URL" required>
                <br><br>

                <p><b>Sexo:</b></p>
                <input type="radio" id="masculino" name="sexo" value="masculino" required>
                <label for="masculino">Masculino</label>
                <br>
                <input type="radio" id="feminino" name="sexo" value="feminino" required>
                <label for="feminino">Feminino</label>
                <br><br>

                <p><b>Assuntos de interesse:</b></p>
                <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
                <label for="tecnologia">Tecnologia</label>
                <br>
                <input type="checkbox" id="esportes" name="interesses" value="esportes">
                <label for="esportes">Esportes </label>
                <br>
                <input type="checkbox" id="filmes" name="interesses" value="filmes">
                <label for="filmes">Filmes</label>
                <br><br>

                <label for="estadoCivil"><b>Estado Civil</b></label>
                <select name="estadoCivil" id="estadoCivil" required>
                    <option value="solteiro">Solteiro(a)</option>
                    <option value="casado">Casado(a)</option>
                    <option value="divorciado">Divorciado(a)</option>
                    <option value="viuvo">Viúvo(a)</option>
                </select>
                <br><br>

                <label for="uf"><b>Estado (UF)</b></label>
                <select name="uf" id="uf" required>
                    <option value="" selected disabled></option>
                    <option value="GO">Goiás</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>
                <br><br>

                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
                <br><br>

            </fieldset>
        </fieldset>
        </fieldset>
    </form>


</body>

</html>
