ia</label>        <input type="checkbox" id="jogos"        name="informacoes" value="jogos">        <label for="jogos">Jogos</label>        <input type="checkbox" id="educacao"        name="informacoes" value="educacao">        <label for="educacao">Educação</label>        <input type="checkbox" id="viagens"        name="informacoes" value="viagens">        <label for="viagens">Viagens</label>        <input type="checkbox" id="empregos"        name="informacoes" value="empregos">        <label for="empregos">Empregos</label>        <input type="checkbox" id="moda"        name="informacoes" value="moda">        <label for="moda">Moda e Estilo</label>        <br><br>        <input type="checkbox" id="termos"        name="termos" value="aceito" required>        <label for="termos">            Li as regras de cadastro e autorizo a criação do usuário        </label>        <br><br>        <input type="submit" value="Confirmar">        <input type="reset" value="Retornar">    </fieldset></form></body></html>
<head>
    <!--
        <head> contém informações sobre a página que normalmente
        não aparecem diretamente na tela.
    -->

    <meta charset="UTF-8">
    <!--
        Define a codificação dos caracteres.
        UTF-8 permite utilizar acentos, ç, símbolos etc.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Faz a página se adaptar a diferentes tamanhos de tela.
        width=device-width -> usa a largura do dispositivo.
        initial-scale=1.0 -> define o zoom inicial como 100%.
    -->

    <title>Atividade 1</title>
    <!--
        Define o título que aparece na aba do navegador.
    -->

</head>
<!-- Fim da área <head>. -->


<body>
<!--
    <body> contém tudo aquilo que será exibido na página.
-->

<h1>Cadastro de Usuário</h1>
<!--
    <h1> é um título principal.
    Normalmente é o título mais importante da página.
-->


<form action="Atividade1.html" method="post">
<!--
    <form> cria um formulário.

    action="Atividade1.html"
    -> informa para onde os dados do formulário serão enviados.

    method="post"
    -> define que os dados serão enviados utilizando o método POST.
    O POST é normalmente utilizado para enviar dados de formulários.
-->


<fieldset>
<!--
    <fieldset> cria uma caixa/borda agrupando campos relacionados.
-->

    <legend><b>Dados Pessoais</b></legend>
    <!--
        <legend> define o título do <fieldset>.
        <b> deixa o texto em negrito.
    -->


    <label for="nome"><b>Nome Completo:</b></label>
    <!--
        <label> cria o texto que identifica um campo.

        for="nome" relaciona o label ao elemento
        que possui id="nome".
    -->


    <input type="text" id="nome" name="nome"
        placeholder="Digite seu nome"
        minlength="3" maxlength="100" required>
    <!--
        <input> cria um campo para entrada de dados.

        type="text"
        -> campo para texto.

        id="nome"
        -> identifica esse elemento dentro da página.
        É utilizado pelo "for" do label.

        name="nome"
        -> nome do campo quando os dados forem enviados pelo formulário.

        placeholder="Digite seu nome"
        -> texto de orientação que aparece dentro do campo.

        minlength="3"
        -> exige pelo menos 3 caracteres.

        maxlength="100"
        -> permite no máximo 100 caracteres.

        required
        -> torna o preenchimento obrigatório.
    -->

    <br><br>
    <!--
        <br> quebra a linha.
        Dois <br> criam um espaço maior entre os elementos.
    -->


    <label for="cpf"><b>CPF:</b></label>

    <input type="text" id="cpf" name="cpf"
        placeholder="Digite seu CPF"
        minlength="11" maxlength="11" required>
    <!--
        Campo para CPF.

        minlength="11" -> mínimo de 11 caracteres.
        maxlength="11" -> máximo de 11 caracteres.

        Como os dois são 11, o campo exige exatamente 11 caracteres.
    -->

    <br><br>


    <label for="dataNascimento">
        <b>Data de Nascimento:</b>
    </label>

    <input type="date" id="dataNascimento"
        name="dataNascimento" required>
    <!--
        type="date"
        -> cria um campo específico para selecionar uma data.

        required
        -> torna o preenchimento obrigatório.
    -->

    <br><br>


    <label><b>Sexo:</b></label>
    <!--
        Label utilizado apenas para apresentar o título "Sexo".
    -->


    <input type="radio" id="masculino"
        name="sexo" value="masculino">

    <label for="masculino">Masculino</label>
    <!--
        type="radio"
        -> cria uma opção de seleção única.

        name="sexo"
        -> todas as opções com o mesmo name pertencem ao mesmo grupo.

        value="masculino"
        -> valor enviado caso essa opção seja escolhida.

        Por terem o mesmo name="sexo", Masculino e Feminino
        funcionam como opções mutuamente exclusivas.
    -->


    <input type="radio" id="feminino"
        name="sexo" value="feminino">

    <label for="feminino">Feminino</label>

    <br><br>


    <label for="estadoCivil"><b>Estado Civil:</b></label>

    <select name="estadoCivil" id="estadoCivil" required>
    <!--
        <select> cria uma lista de opções.

        name="estadoCivil"
        -> nome usado para enviar o valor.

        id="estadoCivil"
        -> identifica o elemento.

        required
        -> exige que uma opção válida seja selecionada.
    -->

        <option value="">Selecione</option>
        <!--
            <option> representa uma opção dentro do select.

            value="" significa que inicialmente não existe
            um valor válido selecionado.
        -->

        <option value="solteiro">Solteiro(a)</option>
        <option value="casado">Casado(a)</option>
        <option value="divorciado">Divorciado(a)</option>
        <option value="viuvo">Viúvo(a)</option>

    </select>

    <br><br>

</fieldset>
<!-- Fim do grupo Dados Pessoais. -->


<fieldset>

    <legend><b>Dados de Contato</b></legend>
    <!-- Título do segundo grupo do formulário. -->


    <label for="email"><b>E-mail:</b></label>

    <input type="email" id="email" name="email"
        placeholder="Digite seu email" required>
    <!--
        type="email"
        -> campo destinado a e-mail.

        O navegador faz uma validação básica do formato,
        como verificar a presença de @.

        required -> preenchimento obrigatório.
    -->

    <br><br>


    <label for="url"><b>Website:</b></label>

    <input type="url" id="url" name="url"
        placeholder="Digite uma URL" required>
    <!--
        type="url"
        -> campo destinado a endereços de sites.

        O navegador faz uma validação básica de URL.
    -->

    <br><br>


    <label for="endereco"><b>Endereço:</b></label>

    <input type="text" id="endereco" name="endereco"
        placeholder="Digite seu endereço"
        minlength="10" maxlength="100" required>
    <!--
        Campo de texto para endereço.

        minlength="10" -> mínimo de 10 caracteres.
        maxlength="100" -> máximo de 100 caracteres.
    -->

    <br><br>


    <label for="bairro"><b>Bairro:</b></label>

    <input type="text" id="bairro" name="bairro"
        placeholder="Digite seu bairro"
        minlength="3" maxlength="50" required>

    <br><br>


    <label for="cidade"><b>Cidade:</b></label>

    <input type="text" id="cidade" name="cidade"
        placeholder="Digite sua cidade"
        minlength="3" maxlength="50" required>

    <br><br>


    <label for="uf"><b>UF:</b></label>

    <select name="uf" id="uf" required>
    <!--
        Lista para selecionar o estado brasileiro.

        UF significa Unidade Federativa.
    -->

        <option value="">Selecione</option>

        <option value="AC">AC</option>
        <option value="AL">AL</option>
        <option value="AP">AP</option>
        <option value="AM">AM</option>
        <option value="BA">BA</option>
        <option value="CE">CE</option>
        <option value="DF">DF</option>
        <option value="ES">ES</option>
        <option value="GO">GO</option>
        <option value="MA">MA</option>
        <option value="MT">MT</option>
        <option value="MS">MS</option>
        <option value="MG">MG</option>
        <option value="PA">PA</option>
        <option value="PB">PB</option>
        <option value="PR">PR</option>
        <option value="PE">PE</option>
        <option value="PI">PI</option>
        <option value="RJ">RJ</option>
        <option value="RN">RN</option>
        <option value="RS">RS</option>
        <option value="RO">RO</option>
        <option value="RR">RR</option>
        <option value="SC">SC</option>
        <option value="SP">SP</option>
        <option value="SE">SE</option>
        <option value="TO">TO</option>

    </select>

    <br><br>


    <label for="cep"><b>CEP:</b></label>

    <input type="text" id="cep" name="cep"
        placeholder="00000000"
        minlength="8" maxlength="8" required>
    <!--
        Campo para CEP.

        minlength e maxlength iguais a 8
        -> exige exatamente 8 caracteres.
    -->

    <br><br>


    <label for="telefone"><b>Telefone:</b></label>

    <input type="tel" id="telefone" name="telefone"
        minlength="10" maxlength="10" required>
    <!--
        type="tel"
        -> campo destinado a números de telefone.

        Neste código, exige exatamente 10 caracteres.
    -->

    <br><br>


    <label for="celular"><b>Celular:</b></label>

    <input type="tel" id="celular" name="celular"
        minlength="11" maxlength="11" required>
    <!--
        Campo para celular.

        Exige exatamente 11 caracteres.
    -->

    <br><br>

</fieldset>
<!-- Fim dos Dados de Contato. -->


<fieldset>

    <legend><b>Dados de Cadastro</b></legend>
    <!-- Título do terceiro grupo. -->


    <label for="login"><b>Login:</b></label>

    <input type="text" id="login" name="login"
        minlength="4" maxlength="20" required>
    <!--
        Campo de login.

        Mínimo: 4 caracteres.
        Máximo: 20 caracteres.
        required: obrigatório.
    -->

    <br><br>


    <label for="senha"><b>Senha:</b></label>

    <input type="password" id="senha" name="senha"
        minlength="6" maxlength="20" required>
    <!--
        type="password"
        -> cria um campo de senha.
        Os caracteres digitados ficam ocultos.

        minlength="6" -> mínimo de 6 caracteres.
        maxlength="20" -> máximo de 20 caracteres.
    -->

    <br><br>


    <b>Deseja receber informações sobre:</b>

    <br><br>


    <input type="checkbox" id="tecnologia"
        name="informacoes" value="tecnologia">
    <label for="tecnologia">Tecnologia</label>
    <!--
        type="checkbox"
        -> cria uma caixa de seleção.

        Diferentemente do radio, várias opções podem
        ser selecionadas ao mesmo tempo.

        name="informacoes"
        -> indica que essa opção pertence ao grupo
        de informações.

        value="tecnologia"
        -> valor enviado se a caixa for marcada.
    -->


    <input type="checkbox" id="esportes"
        name="informacoes" value="esportes">
    <label for="esportes">Esportes</label>


    <input type="checkbox" id="automoveis"
        name="informacoes" value="automoveis">
    <label for="automoveis">Automóveis</label>


    <input type="checkbox" id="culinaria"
        name="informacoes" value="culinaria">
    <label for="culinaria">Culinária</label>


    <input type="checkbox" id="politica"
        name="informacoes" value="politica">
    <label for="politica">Política</label>


    <input type="checkbox" id="tempo"
        name="informacoes" value="tempo">
    <label for="tempo">Tempo</label>


    <br><br>


    <input type="checkbox" id="cultura"
        name="informacoes" value="cultura">
    <label for="cultura">Cultura</label>


    <input type="checkbox" id="economia"
        name="informacoes" value="economia">
    <label for="economia">Economia</label>


    <input type="checkbox" id="jogos"
        name="informacoes" value="jogos">
    <label for="jogos">Jogos</label>


    <input type="checkbox" id="educacao"
        name="informacoes" value="educacao">
    <label for="educacao">Educação</label>


    <input type="checkbox" id="viagens"
        name="informacoes" value="viagens">
    <label for="viagens">Viagens</label>


    <input type="checkbox" id="empregos"
        name="informacoes" value="empregos">
    <label for="empregos">Empregos</label>


    <input type="checkbox" id="moda"
        name="informacoes" value="moda">
    <label for="moda">Moda e Estilo</label>


    <br><br>


    <input type="checkbox" id="termos"
        name="termos" value="aceito" required>
    <!--
        Checkbox para aceitar os termos.

        required
        -> o usuário é obrigado a marcar essa caixa
        antes de enviar o formulário.
    -->


    <label for="termos">
        Li as regras de cadastro e autorizo a criação do usuário
    </label>


    <br><br>


    <input type="submit" value="Confirmar">
    <!--
        type="submit"
        -> cria o botão responsável por enviar o formulário.

        value="Confirmar"
        -> texto que aparece no botão.
    -->


    <input type="reset" value="Retornar">
    <!--
        type="reset"
        -> limpa/redefine os campos do formulário
        para seus valores iniciais.

        value="Retornar"
        -> texto exibido no botão.
    -->


</fieldset>
<!-- Fim dos Dados de Cadastro. -->


</form>
<!-- Fim do formulário. -->


</body>
<!-- Fim do conteúdo visível da página. -->


</html>
<!-- Fim do documento HTML. -->



<!--O que mais pode cair na avaliação

    <html> → documento HTML.

    <head> → configurações da página.

    <body> → conteúdo visível.

    <h1> → título principal.

    <form> → formulário.

    <fieldset> → agrupa campos.

    <legend> → título do grupo.

    <label> → identifica um campo.

    <input> → entrada de dados.

    <select> → lista de opções.

    <option> → opção do select.

    <br> → quebra de linha.

    id → identifica um elemento.

    name → identifica o campo nos dados enviados.

    value → valor enviado/associado ao campo.

    required → obrigatório.

    placeholder → texto de orientação.

    minlength / maxlength → limites de caracteres.

    type="radio" → escolhe uma opção.

    type="checkbox" → permite escolher várias opções.

    type="submit" → envia o formulário.

    type="reset" → restaura os campos.

    method="post" → envia os dados pelo método POST.

    action → indica o destino do envio.-->
