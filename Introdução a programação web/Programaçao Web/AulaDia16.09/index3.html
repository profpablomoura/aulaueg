<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>

<body>

    <h1> Cadastro de Usuário </h1>

    <form action=index3.html method="post">
        <fieldset>
            <legend> <b> Dados Pessoais </b></legend>

            <label for="nome"><b>Nome:</b></label>
            <input type="text" id="nome" placeholder="Digite seu nome" name="nome" required> <br> <br>
            <label for="Email"><b>Email:</b></label>
            <input type="email" id="Email" placeholder="Digite seu email" name="Email" required> <br> <br>
            <label for="dataNascimento"><b>Data de Nascimento:</b></label>
            <input type="date" id="dataNascimento" name="dataNascimento" required> <br> <br>

        </fieldset> <br>

        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>


    </form>
</body>

</html>
